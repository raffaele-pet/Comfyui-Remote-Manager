name: Release Windows installers

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          architecture: x64
      - name: Build installers
        run: |
          python -m pip install "PyInstaller==6.22.3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/build_installers.py
      - name: Publish the installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          @'
          Download install-server.exe on PC Server and install-client.exe on PC Client.

          To run from source, extract the source ZIP and open install-server.bat and install-client.bat on the corresponding PCs. Launch the app on PC Client with run.bat.
          '@ | Set-Content -Encoding UTF8 release-notes.md
          gh release create $env:RELEASE_TAG dist/install-server.exe dist/install-client.exe --verify-tag --title "ComfyUI Remote Manager $env:RELEASE_TAG" --notes-file release-notes.md
